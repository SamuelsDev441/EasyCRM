<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Role</title>
    <link rel="stylesheet" href="/css/choose.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="choose">
      <div class="panel">
        <h1>Select your role</h1>
        <p>Pick how you want to access EasyCRM.</p>
        <div class="options">
          <a class="card admin" href="/start-login?returnTo=/admin">
            <h2>Admin</h2>
            <p>Manage teams, payroll, invoices, and onboarding.</p>
          </a>
          <a class="card employee" href="/start-login?returnTo=/employee">
            <h2>Employee</h2>
            <p>View your onboarding tasks and pay history.</p>
          </a>
        </div>
        <a class="back" href="/">Back to site</a>
      </div>
    </main>
  </body>
</html>
