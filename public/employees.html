<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCRM - Employees</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Employees</h1>
    <ul id="list"></ul>
    <script>
        fetch("/api/employees")
            .then(res => res.json())
            .then(data => {
            const ul = document.getElementById("list");
            data.forEach(e => {
                const li = document.createElement("li");
                li.textContent = e.name;
                ul.appendChild(li);
                });
            });
    </script>
</body>
</html>
